name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One production deploy at a time; queue rather than cancel so an older commit
# can never land on top of a newer one.
concurrency:
  group: netlify-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy to Netlify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.netlify.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Netlify credentials are configured
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Missing NETLIFY_AUTH_TOKEN and/or NETLIFY_SITE_ID repository secret."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Same gate as the pull request build: a red main never reaches Netlify.
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

      - name: Deploy to Netlify
        id: netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          npx --yes netlify-cli@27 deploy \
            --prod \
            --dir=frontend/dist \
            --message "Deploy ${GITHUB_SHA::7} from ${GITHUB_REF_NAME}" \
            --json > deploy.json
          url="$(jq -r '.url' deploy.json)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ${GITHUB_SHA::7} to $url" >> "$GITHUB_STEP_SUMMARY"
